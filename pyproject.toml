[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-whisper"
version = "0.1.0"
description = "Local-first Whisper dictation app for macOS"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PySide6>=6.7",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "pynput>=1.7",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
aura-whisper = "aura_whisper.__main__:main"

[tool.setuptools.packages.find]
include = ["aura_whisper*"]

[tool.setuptools.package-data]
aura_whisper = ["resources/*.qss"]
